<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cattle Care System</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    <!-- Chart.js for Graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- PDF Generation Libs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-cow"></i>
                <span data-i18n="logo">CattleCare</span>
            </div>
            <ul class="nav-links">
                <li class="active" data-target="dashboard">
                    <i class="fa-solid fa-chart-line"></i>
                    <span data-i18n="nav-dashboard">Dashboard</span>
                </li>
                <li data-target="disease-detection">
                    <i class="fa-solid fa-stethoscope"></i>
                    <span data-i18n="nav-disease">Disease Detection</span>
                </li>
                <li data-target="smart-trade">
                    <i class="fa-solid fa-handshake"></i>
                    <span data-i18n="nav-trade">Smart Trade</span>
                </li>
                <li data-target="advisory">
                    <i class="fa-solid fa-seedling"></i>
                    <span data-i18n="nav-advisory">Advisory</span>
                </li>
            </ul>
            <!-- Language Selector -->
            <div class="language-selector" style="margin-top: auto; padding: 10px;">
                <select id="lang-select" class="form-control" style="border: 1px solid #2ecc71;">
                    <option value="en-US">English</option>
                    <option value="hi-IN">Hindi (हिंदी)</option>
                    <option value="te-IN">Telugu (తెలుగు)</option>
                    <option value="ta-IN">Tamil (தமிழ்)</option>
                    <option value="kn-IN">Kannada (ಕನ್ನಡ)</option>
                    <option value="ml-IN">Malayalam (മലയാളം)</option>
                </select>
            </div>

            <div class="voice-assistant-btn" id="voice-btn">
                <i class="fa-solid fa-microphone"></i>
                <span data-i18n="voice-btn">Voice Assistant</span>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-bar">
                <h2 id="page-title">Dashboard</h2>
                <div class="user-profile">
                    <span>Welcome, Farmer</span>
                    <div class="avatar">
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>
            </header>

            <div id="content-area" class="content-area">
                <!-- Dynamic Content will be injected here -->
            </div>
        </main>
    </div>

    <!-- AI Pattern Matching Library -->
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.js"></script>

    <!-- Main Logic -->
    <script src="app.js?v=13"></script>
</body>

</html>
